<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>91RADIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="viz" aria-hidden="true"></canvas>
    <main class="stage">
      <h1>91RADIO</h1>
      <button type="button" class="play" id="play" aria-label="Play">
        <span id="play-icon">▶</span>
      </button>
      <p class="now-label">Сейчас</p>
      <h2 id="title">Тишина</h2>
      <p class="hint" id="hint"></p>
    </main>
    <section class="karaoke" id="karaoke" aria-live="polite">
      <p class="karaoke-line prev" id="karaoke-prev"></p>
      <p class="karaoke-line current" id="karaoke-current"></p>
      <p class="karaoke-line next" id="karaoke-next"></p>
    </section>
    <audio id="player" preload="none"></audio>
    <script src="viz.js"></script>
    <script src="app.js"></script>
  </body>
</html>
